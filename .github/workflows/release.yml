name: Release
# Builds release binaries for a pushed version tag and attaches them to a
# DRAFT GitHub Release. Publishing the draft is a separate, manual step.
# Pull requests that touch the release tooling build and package only.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - Cargo.toml
      - Cargo.lock
permissions:
  contents: read
jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Draft created by the release workflow. Replace with the reviewed release notes before publishing."
          fi

  build:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      # Needed only by the tag-gated upload step; the token is not exposed to
      # build steps (no GH_TOKEN there, and checkout does not persist it).
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="workflow-trust-check-$TAG-$TARGET"
          mkdir -p "dist/$name"
          exe=""
          [[ "$TARGET" == *windows* ]] && exe=".exe"
          cp "target/$TARGET/release/workflow-trust-check$exe" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          python3 scripts/third_party_licenses.py "$TARGET" "dist/$name/THIRD-PARTY-LICENSES.md" \
            || python scripts/third_party_licenses.py "$TARGET" "dist/$name/THIRD-PARTY-LICENSES.md"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=dist/$archive" >> "$GITHUB_ENV"
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
