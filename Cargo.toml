[package]
name = "workflow-trust-check"
version = "0.1.0"
edition = "2024"
description = "A read-only, offline explainer for GitHub Actions trust boundaries"
license = "MIT"
repository = "https://github.com/jahau/workflow-trust-check"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
marked-yaml = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
